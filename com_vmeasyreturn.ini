; Template: com_vmeasyreturn.withdrawal.customer
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_TITLE="Customer Withdrawal Confirmation (Verified Order)"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_DESC="Statutory email sent to customer confirming receipt of contractual withdrawal declaration for a verified order."
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_SUBJECT="Confirmation of Withdrawal: Order {ORDER_NUMBER} ({WITHDRAWAL_REF})"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_BODY="Confirmation of Withdrawal from Contract\n=======================================\n\nDear {CUSTOMER_NAME},\n\nPursuant to EU Directive 2023/2673 amending Directive 2011/83/EU, we hereby confirm receipt of your declaration of withdrawal from the sales contract on this durable medium.\n\nWithdrawal Reference: {WITHDRAWAL_REF}\nOrder Number: {ORDER_NUMBER}\nDate/Time of Receipt: {DATE}\nResolution: {RESOLUTION}\n\nItems Returned:\n{ITEMS_LIST}\n\nYour Comments:\n{CUSTOMER_NOTE}\n\nReturn Instructions & Warehouse Address:\n{WAREHOUSE_ADDRESS}\n\nPlease send the goods back to our return warehouse without undue delay and at the latest within 14 days from the date of this confirmation.\n\nReimbursement will be processed using the same means of payment as you used for the initial transaction once the goods are received or evidence of dispatch is provided.\n\nKind regards,\n{SITENAME} Support Team\n{SITEURL}"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_BODY_HTML="<div style=\"font-family:sans-serif; line-height:1.6; color:#333;\"><h2>Confirmation of Withdrawal from Contract</h2><p>Dear {CUSTOMER_NAME},</p><p>Pursuant to EU Directive 2023/2673 amending Directive 2011/83/EU, we hereby confirm receipt of your declaration of withdrawal from the sales contract on this durable medium.</p><table style=\"margin-bottom:15px;\"><tr><td><strong>Withdrawal Reference:</strong></td><td>{WITHDRAWAL_REF}</td></tr><tr><td><strong>Order Number:</strong></td><td>{ORDER_NUMBER}</td></tr><tr><td><strong>Date/Time of Receipt:</strong></td><td>{DATE}</td></tr><tr><td><strong>Resolution:</strong></td><td>{RESOLUTION}</td></tr></table><h3>Items Returned</h3>{ITEMS_LIST}<p><strong>Your Comments:</strong><br>{CUSTOMER_NOTE}</p><h3>Return Instructions &amp; Warehouse Address</h3><p>Please send the goods back to our return warehouse without undue delay and at the latest within 14 days from the date of this confirmation:</p><div style=\"background:#f9f9f9; padding:12px; border-left:4px solid #007bff; margin-bottom:15px;\">{WAREHOUSE_ADDRESS}</div><p>Reimbursement will be processed using the same means of payment as you used for the initial transaction once the goods are received or evidence of dispatch is provided.</p><p>Kind regards,<br>{SITENAME} Support Team<br><a href=\"{SITEURL}\">{SITEURL}</a></p></div>"

; Template: com_vmeasyreturn.withdrawal.customer_unverified
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_UNVERIFIED_TITLE="Customer Withdrawal Acknowledgment (Unverified Order)"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_UNVERIFIED_DESC="Statutory email sent to customer acknowledging receipt of notice of withdrawal when order details require manual store verification."
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_UNVERIFIED_SUBJECT="Acknowledgment of Receipt: Notice of Withdrawal ({WITHDRAWAL_REF})"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_UNVERIFIED_BODY="Acknowledgment of Receipt: Notice of Withdrawal\n==============================================\n\nDear {CUSTOMER_NAME},\n\nWe acknowledge receipt of your notice of withdrawal submitted through our online portal.\n\nWithdrawal Reference: {WITHDRAWAL_REF}\nSubmitted Order Number: {ORDER_NUMBER}\nDate/Time of Receipt: {DATE}\n\nNotice: Your declaration has been recorded and queued for manual verification by our store team. We will review the order details and follow up with return instructions shortly.\n\nKind regards,\n{SITENAME} Support Team\n{SITEURL}"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_CUSTOMER_UNVERIFIED_BODY_HTML="<div style=\"font-family:sans-serif; line-height:1.6; color:#333;\"><h2>Acknowledgment of Receipt: Notice of Withdrawal</h2><p>Dear {CUSTOMER_NAME},</p><p>We acknowledge receipt of your notice of withdrawal submitted through our online portal.</p><table style=\"margin-bottom:15px;\"><tr><td><strong>Withdrawal Reference:</strong></td><td>{WITHDRAWAL_REF}</td></tr><tr><td><strong>Submitted Order Number:</strong></td><td>{ORDER_NUMBER}</td></tr><tr><td><strong>Date/Time of Receipt:</strong></td><td>{DATE}</td></tr></table><div style=\"background:#e8f4fd; padding:12px; border-left:4px solid #17a2b8; margin-bottom:15px;\"><p style=\"margin:0;\"><strong>Notice:</strong> Your declaration has been recorded and queued for manual verification by our store team. We will review the order details and follow up with return instructions shortly.</p></div><p>Kind regards,<br>{SITENAME} Support Team<br><a href=\"{SITEURL}\">{SITEURL}</a></p></div>"

; Template: com_vmeasyreturn.withdrawal.admin
COM_VMEASYRETURN_MAIL_WITHDRAWAL_ADMIN_TITLE="Store Admin Withdrawal Notification"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_ADMIN_DESC="Notification email sent to store administrators upon submission of a new customer withdrawal declaration."
COM_VMEASYRETURN_MAIL_WITHDRAWAL_ADMIN_SUBJECT="[Withdrawal Notice] Ref: {WITHDRAWAL_REF} - Order: {ORDER_NUMBER}"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_ADMIN_BODY="{WARNING_BANNER}New Customer Withdrawal Declaration\n-------------------------------------\nReference: {WITHDRAWAL_REF}\nOrder Number: {ORDER_NUMBER}\nCustomer Name: {CUSTOMER_NAME}\nEmail: {CUSTOMER_EMAIL}\nPhone: {CUSTOMER_PHONE}\nDate/Time: {DATE}\nVerified: {IS_VERIFIED}\nResolution: {RESOLUTION}\n\nCustomer Comments:\n{CUSTOMER_NOTE}\n\nItems Returned:\n{ITEMS_LIST}\n\nAdmin Link: {ADMIN_MANAGE_URL}"
COM_VMEASYRETURN_MAIL_WITHDRAWAL_ADMIN_BODY_HTML="<div style=\"font-family:sans-serif; line-height:1.5;\">{WARNING_BANNER}<h2>New Customer Withdrawal Declaration</h2><p><strong>Reference:</strong> {WITHDRAWAL_REF}<br><strong>Order Number:</strong> {ORDER_NUMBER}<br><strong>Customer Name:</strong> {CUSTOMER_NAME}<br><strong>Email:</strong> {CUSTOMER_EMAIL}<br><strong>Phone:</strong> {CUSTOMER_PHONE}<br><strong>Date/Time:</strong> {DATE}<br><strong>Verified:</strong> {IS_VERIFIED}<br><strong>Resolution:</strong> {RESOLUTION}</p><p><strong>Customer Comments:</strong><br>{CUSTOMER_NOTE}</p><h3>Items Returned</h3>{ITEMS_LIST}<p><a href=\"{ADMIN_MANAGE_URL}\" style=\"display:inline-block; padding:10px 16px; background:#007bff; color:#fff; text-decoration:none; border-radius:4px;\">View in Administrator</a></p></div>"

